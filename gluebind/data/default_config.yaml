# Complete Gluebind calculation template.
#
# Copy this file beside your input structures and replace the paths below.
# Input paths are resolved relative to this YAML file. Set `glue: null` when
# modelling a binary complex, and `waters: null` when no crystal waters are kept.

inputs:
  target:
    prm7: target.prm7
    rst7: target.rst7
  receptor:
    prm7: receptor.prm7
    rst7: receptor.rst7
  glue:
    sdf: glue.sdf
    assign_to: receptor
  waters: null

prep:
  glue_forcefield: openff_unconstrained_2.2.1
  ligand_charge: auto       # auto, or an integer passed as net_charge
  water_model: tip3p
  box_type: truncatedOctahedron
  box_padding_angstrom: 15.0       # Å; complex solvent padding
  bulk_box_padding_angstrom: 20.0  # Å; isolated receptor/target padding
  ion_concentration_M: 0.15       # mol L^-1; ionic strength for solvation
  neutralise: true
  minimisation_steps: 10000       # integration steps
  nvt_heat_ns: 0.2                # ns; NVT heating
  npt_ns: 0.4                     # ns; NPT equilibration
  equilibration_ns: 50.0          # ns; production equilibration

sampling:
  timestep_fs: 4.0              # fs
  hmr_factor: 1.5               # dimensionless; hydrogen-mass repartitioning
  pme_cutoff_nm: 1.0            # nm; PME real-space cutoff
  temperature_K: 300.0          # K
  sample_interval_steps: 125    # integration steps between saved CV samples
  state_data_interval_steps: 10000  # integration steps between state reports
  trajectory_interval_steps: 2500  # integration steps between DCD frames
  save_trajectories: false       # write per-window DCD trajectories
  ensemble_size: 3              # independent replicas per window
  run_rmsd_us: true
  run_separation_us: true       # false + run_rmsd_us=false: equilibration + Boresch US only
  boresch:
    force_constant: 100.0       # kcal mol^-1 rad^-2
    sampling_time_ns: 5.0       # ns; recorded sampling per window
    equil_discard_ns: 1.0       # ns; discarded equilibration per window
    window_spacing: 0.1         # rad; angular window spacing
    window_min: null             # rad
    window_max: null             # rad
    coarse_from: null            # rad
    coarse_spacing: null         # rad
    centres: null                # rad; explicit centres (list or per-DoF mapping)
    auto_extend: false
    overrides: {}
  rmsd:
    force_constant: 5.0         # kcal mol^-1 Å^-2
    sampling_time_ns: 20.0       # ns; recorded sampling per window
    equil_discard_ns: 0.0        # ns; discarded equilibration per window
    window_spacing: 0.2          # Å; RMSD window spacing
    window_min: 0.0              # Å
    window_max: 2.2              # Å
    coarse_from: null            # Å
    coarse_spacing: null         # Å
    centres: null                # Å; explicit window centres
    auto_extend: true
    overrides: {}
  separation:
    force_constant: 10.0        # kcal mol^-1 Å^-2
    sampling_time_ns: 30.0       # ns; recorded sampling per window
    equil_discard_ns: 0.0        # ns; discarded equilibration per window
    window_spacing: 0.05         # nm; separation window spacing
    window_min: 0.9              # nm
    window_max: 3.0              # nm
    coarse_from: 2.1             # nm
    coarse_spacing: 0.1          # nm
    smd_snapshot_spacing: 0.05   # nm; SMD snapshot grid
    smd_capture_max: 4.0         # nm; largest SMD snapshot separation
    smd_pull_margin: 0.5         # nm; extra SMD pull distance
    centres: null                # nm; explicit window centres
    auto_extend: false
    overrides: {}

restraints:
  # Empty lists select all-Cα RMSD restraints for each protein.
  rmsd_cvs: []
  rmsd_order: []
  rmsd_atoms: CA
  always_on: []
  always_on_atoms: CA
  boresch:
    anchors: auto
