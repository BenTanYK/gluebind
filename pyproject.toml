[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gluebind"
description = "Automated Umbrella Sampling protocol for calculating the binding free energy of ternary complexes"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gluebind*"]

[tool.setuptools.package-data]
"gluebind" = ["data/**/*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["gluebind/tests"]
markers = [
    "integration: opt-in tests using real MD/cheminformatics dependencies",
    "gpu: requires a CUDA GPU (auto-skipped when absent)",
    "slurm: submits real jobs through Slurm; requires a shared filesystem",
]
# Bare `pytest` / `make test` runs only the fast unit suite. The 1FAP Slurm
# end-to-end validation is explicitly opt-in via `make test-integration`.
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["C901"]
select = ["B","C","E","F","W","B9"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["gluebind"]
exclude = ["gluebind/tests/**"]

[tool.coverage.run]
omit = ["**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "@overload",
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
